<!DOCTYPE html>
<html lang="en" data-theme="midnight_gold">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Free Account — Celebration Studio</title>

  <link rel="stylesheet" href="static/css/tokens.css">
  <link rel="stylesheet" href="static/css/studio.css">
  <link rel="stylesheet" href="static/css/animation-engine.css">
  <link rel="stylesheet" href="static/css/modern_3d_ui.css">

  <style>
    .auth-page-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      z-index: 2;
    }

    .auth-glass-box {
      width: 100%;
      max-width: 440px;
      background: rgba(16, 23, 38, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      backdrop-filter: blur(24px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body data-intensity="high">

  <div class="celebration-ambient-backdrop" id="masterAmbientBackdrop">
    <div class="ambient-layer-artwork"></div>
    <div class="ambient-layer-glow"></div>
    <canvas id="ambientParticleCanvas"></canvas>
    <div class="ambient-layer-vignette"></div>
  </div>

  <div class="auth-page-container">
    <div class="auth-glass-box">
      <div style="text-align: center; margin-bottom: var(--space-6);">
        <a href="index.html" class="brand-logo" style="display: inline-flex; justify-content: center; margin-bottom: 12px;">
          <div class="brand-icon">✨</div>
          <span>Celebration Studio</span>
        </a>
        <h2 class="font-display" style="font-size: 1.6rem; color: #fff; margin-bottom: 4px;">Join Celebration Studio</h2>
        <p style="color: var(--text-muted); font-size: 0.85rem;">Create your creator profile to save and orchestrate 3D celebrations.</p>
      </div>

      <form onsubmit="handleAuthRegister(event)">
        <div class="form-group" style="margin-bottom: var(--space-4);">
          <label class="form-label">Creator Name</label>
          <input type="text" id="regUser" required class="form-control" placeholder="e.g. Elena Rostova">
        </div>

        <div class="form-group" style="margin-bottom: var(--space-4);">
          <label class="form-label">Email Address</label>
          <input type="email" id="regEmail" required class="form-control" placeholder="elena@example.com">
        </div>

        <div class="form-group" style="margin-bottom: var(--space-6);">
          <label class="form-label">Password</label>
          <input type="password" id="regPass" required class="form-control" placeholder="Create strong password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; border-radius: 999px; height: 44px; margin-bottom: var(--space-4);">
          ✦ Create Atelier Account
        </button>

        <div style="text-align: center; font-size: 0.85rem; color: var(--text-muted);">
          Already have an account? <a href="login.html" style="color: var(--theme-primary); text-decoration: none; font-weight: 600;">Sign In</a>
        </div>
      </form>
    </div>
  </div>

  <script src="static/js/templates_catalog.js"></script>
  <script src="static/js/animation_themes.js"></script>
  <script src="static/js/backend_storage.js"></script>
  <script src="static/js/nav_header.js"></script>
  <script src="static/js/modern_3d_ui.js"></script>

  <script>
    function handleAuthRegister(e) {
      e.preventDefault();
      const user = document.getElementById('regUser').value.trim() || 'Atelier Creator';
      const email = document.getElementById('regEmail').value.trim();
      window.CelebrationDB.setUser({ username: user, email: email, is_authenticated: true, is_superuser: true });
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
