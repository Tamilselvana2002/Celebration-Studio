<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celebration Studio — Clean Route Redirect</title>
  <style>
    body {
      background: #09090b;
      color: #fdf2f8;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: rgba(24, 24, 27, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 32px 40px;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 20px;
      border: 3px solid rgba(244, 114, 182, 0.2);
      border-top-color: #f472b6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #f472b6;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
  <script>
    (function() {
      var path = window.location.pathname;
      var clean = path.replace(/^\/+|\/+$/g, '').split('/').pop();
      var known = {
        '': 'index.html',
        'create': 'create.html',
        'dashboard': 'dashboard.html',
        'templates': 'templates.html',
        'editor': 'editor.html',
        'preview': 'preview.html',
        'recipients': 'recipients.html',
        'media-vault': 'media-vault.html',
        'profile': 'profile.html',
        'login': 'login.html',
        'register': 'register.html'
      };

      if (known[clean]) {
        var target = '/' + known[clean] + window.location.search + window.location.hash;
        window.location.replace(target);
      } else {
        setTimeout(function() {
          window.location.replace('/index.html');
        }, 1200);
      }
    })();
  </script>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2 style="margin: 0 0 10px; font-size: 20px;">Finding Celebration...</h2>
    <p style="color: #a1a1aa; font-size: 14px; margin-bottom: 20px;">Directing you to the requested studio experience.</p>
    <a href="/index.html">Return to Atelier Home</a>
  </div>
</body>
</html>
