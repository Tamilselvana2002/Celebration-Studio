{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="midnight_gold">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signed Out — Celebration Studio</title>
  
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/studio.css' %}">
</head>
<body style="margin: 0; padding: 0; background: #080a10; overflow: hidden;">

  <div class="auth-viewport">
    <!-- Living Golden Embers Ambient Canvas -->
    <canvas id="logoutCanvas" class="auth-ambient-canvas"></canvas>

    <!-- Pulsing Radial Atmospheric Core -->
    <div class="auth-glow-radial"></div>

    <!-- Luxury Glassmorphism Sign Out Plaque -->
    <div class="auth-card" id="logoutCard">
      <div class="auth-icon-wrap" id="logoutIcon">
        <div class="auth-icon-ring"></div>
        <span>🔒</span>
      </div>

      <div class="auth-badge">✦ SESSION CONCLUDED ✦</div>
      <h1 class="auth-title">Session Securely Closed</h1>
      <p class="auth-subtitle">Your celebration designs and media assets are safely stored. You have been successfully signed out of the studio.</p>

      <!-- Animated Circular Countdown Ring -->
      <div class="logout-countdown-ring">
        <svg class="logout-countdown-svg" width="80" height="80">
          <circle cx="40" cy="40" r="35" stroke="rgba(255,255,255,0.08)" stroke-width="4" fill="none" />
          <circle id="logoutCircle" class="logout-circle-progress" cx="40" cy="40" r="35" stroke="var(--theme-primary)" stroke-width="4" fill="none" />
        </svg>
        <span id="logoutNum">3</span>
      </div>

      <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: var(--space-5);">
        Returning to Celebration Studio in <strong id="countdownText" style="color: var(--theme-primary);">3</strong> seconds...
      </p>

      <div style="display: flex; gap: 10px; margin-top: 14px; width: 100%;">
        <a href="{% url 'login' %}" class="auth-btn-submit" id="signInAgainBtn" style="flex: 1; text-decoration: none; text-align: center;">
          <span>Sign In Again →</span>
        </a>
        <a href="{% url 'landing' %}" class="btn btn-ghost" id="homeBtn" style="flex: 1; text-decoration: none; text-align: center; border: 1px solid rgba(255,255,255,0.15); border-radius: 999px;">
          <span>Return Home</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Vendor Animation Libraries -->
  <script src="{% static 'vendor/gsap.min.js' %}"></script>

  <script>
    // 1. Ambient Stardust Canvas
    const canvas = document.getElementById('logoutCanvas');
    if (canvas) {
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });

      const particles = Array.from({ length: 35 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 2 + 0.6,
        speedY: (Math.random() * 0.4 + 0.15),
        speedX: (Math.random() - 0.5) * 0.25,
        alpha: Math.random() * 0.5 + 0.2
      }));

      function render() {
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#E6C065';
        particles.forEach(p => {
          p.y += p.speedY;
          p.x += p.speedX;
          if (p.y > h + 10) {
            p.y = -10;
            p.x = Math.random() * w;
          }
          ctx.globalAlpha = p.alpha;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        });
        requestAnimationFrame(render);
      }
      render();
    }

    // 2. Cinematic Entrance & Choreographed Countdown Exit
    const homeUrl = "{% url 'landing' %}";

    if (window.gsap) {
      const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

      tl.fromTo('#logoutCard',
        { opacity: 0, scale: 0.85, filter: 'blur(16px)', y: 25 },
        { opacity: 1, scale: 1, filter: 'blur(0px)', y: 0, duration: 1.0 }
      );

      tl.fromTo(['#logoutIcon', '.auth-badge', '.auth-title', '.auth-subtitle', '.logout-countdown-ring', '#homeBtn'],
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, stagger: 0.08, duration: 0.6 },
        '-=0.5'
      );
    }

    // Countdown logic
    let remaining = 3;
    const total = 3;
    const circumference = 220; // 2 * PI * 35 = 219.9
    const circle = document.getElementById('logoutCircle');
    const numEl = document.getElementById('logoutNum');
    const textEl = document.getElementById('countdownText');
    const card = document.getElementById('logoutCard');

    function exitToHome() {
      clearInterval(timer);
      const redirectTimer = setTimeout(() => {
        window.location.href = homeUrl;
      }, 500);

      if (window.gsap && card) {
        gsap.to(card, {
          opacity: 0,
          scale: 0.92,
          filter: 'blur(10px)',
          duration: 0.45,
          ease: 'power2.in',
          onComplete: () => {
            clearTimeout(redirectTimer);
            window.location.href = homeUrl;
          }
        });
      } else {
        clearTimeout(redirectTimer);
        window.location.href = homeUrl;
      }
    }

    const timer = setInterval(() => {
      remaining--;
      if (remaining > 0) {
        if (numEl) numEl.textContent = remaining;
        if (textEl) textEl.textContent = remaining;
        if (circle) {
          const offset = circumference - (remaining / total) * circumference;
          circle.style.strokeDashoffset = offset;
        }
        if (window.gsap && numEl) {
          gsap.fromTo(numEl, { scale: 1.3 }, { scale: 1, duration: 0.3 });
        }
      } else {
        clearInterval(timer);
        if (numEl) numEl.textContent = '✦';
        if (textEl) textEl.textContent = '0';
        if (circle) circle.style.strokeDashoffset = circumference;
        exitToHome();
      }
    }, 1000);

    // Immediate click exit
    const homeBtn = document.getElementById('homeBtn');
    if (homeBtn) {
      homeBtn.addEventListener('click', (e) => {
        e.preventDefault();
        clearInterval(timer);
        exitToHome();
      });
    }
  </script>
</body>
</html>
