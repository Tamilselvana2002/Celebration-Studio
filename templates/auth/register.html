{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="romantic_aurora">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Create Your Account — Celebration Studio</title>
  
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">

  <style>
    /* ==========================================================================
       DREAMY FLORAL GARDEN 3D REGISTRATION — CELEBRATION STUDIO
       Matches 02_registration_3d.jpg: Blooming cherry blossom & crystal glass slab
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #120918;
      color: #fdf2f8;
      font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* 3D WebGL Canvas Layer (Petals & Garden Atmosphere) */
    #gardenCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Dreamy Romantic Atmosphere & Sunbeams */
    .garden-atmosphere {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: 
        radial-gradient(circle at 80% 20%, rgba(244, 114, 182, 0.28) 0%, rgba(244, 114, 182, 0) 50%),
        radial-gradient(circle at 20% 80%, rgba(139, 92, 246, 0.22) 0%, rgba(139, 92, 246, 0) 60%),
        radial-gradient(circle at 50% 50%, rgba(18, 9, 24, 0.3) 0%, rgba(12, 6, 18, 0.82) 80%, #0d0614 100%);
    }

    /* Main Container */
    .auth-stage {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 450px;
      padding: 24px;
      perspective: 1000px;
    }

    /* Crystal Glass Slab (Matches 02_registration_3d.jpg) */
    .crystal-card {
      position: relative;
      background: radial-gradient(130% 100% at 75% 15%, rgba(255, 255, 255, 0.24) 0%, rgba(255, 220, 240, 0.1) 45%, rgba(24, 12, 34, 0.72) 100%);
      backdrop-filter: blur(28px) saturate(170%);
      -webkit-backdrop-filter: blur(28px) saturate(170%);
      border: 1.5px solid rgba(255, 255, 255, 0.36);
      border-radius: 28px;
      padding: 40px 34px 34px;
      box-shadow: 
        0 24px 60px rgba(0, 0, 0, 0.65),
        0 0 50px rgba(236, 72, 153, 0.22),
        inset 0 1px 2px rgba(255, 255, 255, 0.6);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* Specular Light Glint on Chamfered Glass Corner */
    .crystal-card::after {
      content: '';
      position: absolute;
      top: -24px;
      right: -24px;
      width: 90px;
      height: 90px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 70%);
      pointer-events: none;
      filter: blur(4px);
    }

    /* Card Typography Header */
    .header-group {
      text-align: center;
      margin-bottom: 26px;
    }

    .card-title {
      font-size: 1.85rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.025em;
      margin-bottom: 6px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    }

    .card-subtitle {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.75);
      font-weight: 400;
    }

    /* Form Fields */
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .pill-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 9999px;
      padding: 0 18px;
      height: 50px;
      transition: all 0.25s ease;
    }

    .pill-input-wrap:focus-within {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(244, 114, 182, 0.85);
      box-shadow: 0 0 18px rgba(244, 114, 182, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    .input-icon {
      flex-shrink: 0;
      color: rgba(255, 255, 255, 0.65);
      width: 19px;
      height: 19px;
      margin-right: 12px;
    }

    .pill-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 0.95rem;
      font-family: inherit;
    }

    .pill-input::placeholder {
      color: rgba(255, 255, 255, 0.48);
    }

    .toggle-password-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.55);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: color 0.2s;
    }
    .toggle-password-btn:hover {
      color: #ffffff;
    }

    /* Sign Up Button (Matches 02_registration_3d.jpg: Sleek Deep Violet/Indigo Pill) */
    .btn-violet-signup {
      margin-top: 10px;
      height: 52px;
      border-radius: 9999px;
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      background: linear-gradient(135deg, #322557 0%, #1e1739 100%);
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(139, 92, 246, 0.3);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-violet-signup:hover {
      transform: translateY(-2px) scale(1.015);
      background: linear-gradient(135deg, #443275 0%, #291f4d 100%);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(139, 92, 246, 0.5);
    }

    .btn-violet-signup:active {
      transform: translateY(1px) scale(0.99);
    }

    /* Bottom Redirect Link */
    .bottom-link-wrap {
      text-align: center;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .bottom-link-text {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.75);
    }

    .sign-in-link {
      color: #ffffff;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
      margin-left: 4px;
    }

    .sign-in-link:hover {
      color: #f472b6;
      text-shadow: 0 0 10px rgba(244, 114, 182, 0.6);
    }

    /* Error Banner */
    .error-banner {
      background: rgba(239, 68, 68, 0.25);
      border: 1px solid rgba(239, 68, 68, 0.55);
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 0.86rem;
      color: #fca5a5;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Screen Reader Only Utility */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    @media (max-width: 480px) {
      .crystal-card {
        padding: 32px 22px 26px;
        border-radius: 24px;
      }
      .card-title {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

  <!-- Living 3D WebGL Canvas Layer (Petals & Atmosphere) -->
  <canvas id="gardenCanvas" class="authCanvas"></canvas>

  <!-- Atmospheric Backdrop Layer -->
  <div class="garden-atmosphere"></div>

  <!-- Central Authentication Stage -->
  <main class="auth-stage">
    <div class="crystal-card" id="authCard">
      
      <!-- Header (Matches 02_registration_3d.jpg) -->
      <div class="header-group">
        <div class="auth-badge" style="font-size: 0.72rem; letter-spacing: 0.15em; color: var(--theme-primary); text-align: center; margin-bottom: 8px;">✦ JOIN CELEBRATION STUDIO ✦</div>
        <h1 class="card-title">Create Account</h1>
        <p class="card-subtitle">Start creating beautiful celebrations</p>
      </div>

      <!-- Error Feedback -->
      {% if error %}
      <div class="error-banner" id="errorBanner" role="alert">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <!-- Registration Form (Matches 02_registration_3d.jpg) -->
      <form method="post" action="{% url 'register' %}" class="auth-form" id="registerForm">
        {% csrf_token %}

        <!-- Full Name / Username Field -->
        <div class="pill-input-wrap">
          <label for="usernameInput" class="sr-only">Full Name or Username</label>
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input 
            type="text" 
            id="usernameInput" 
            name="username" 
            class="pill-input" 
            placeholder="Full Name" 
            value="{{ username|default:'' }}"
            required 
            autofocus 
            autocomplete="name"
          >
        </div>

        <!-- Email Address Field -->
        <div class="pill-input-wrap">
          <label for="emailInput" class="sr-only">Email Address</label>
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          <input 
            type="email" 
            id="emailInput" 
            name="email" 
            class="pill-input" 
            placeholder="Email Address" 
            value="{{ email|default:'' }}"
            autocomplete="email"
          >
        </div>

        <!-- Password Field with Show/Hide Eye Toggle -->
        <div class="pill-input-wrap">
          <label for="passwordInput" class="sr-only">Password</label>
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input 
            type="password" 
            id="passwordInput" 
            name="password" 
            class="pill-input" 
            placeholder="Password" 
            required 
            autocomplete="new-password"
          >
          <button type="button" class="toggle-password-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
            <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <!-- Confirm Password Field -->
        <div class="pill-input-wrap">
          <label for="confirmPasswordInput" class="sr-only">Confirm Password</label>
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          <input 
            type="password" 
            id="confirmPasswordInput" 
            name="confirm_password" 
            class="pill-input" 
            placeholder="Confirm Password" 
            required 
            autocomplete="new-password"
          >
        </div>

        <!-- Sign Up Button (Matches 02_registration_3d.jpg) -->
        <button type="submit" class="btn-violet-signup" id="submitBtn">
          <span>Sign Up</span>
        </button>

        <!-- Bottom Redirect Link (Matches 02_registration_3d.jpg) -->
        <div class="bottom-link-wrap">
          <span class="bottom-link-text">Already have an account?</span>
          <a href="{% url 'login' %}" class="sign-in-link">Sign In</a>
        </div>
      </form>

    </div>
  </main>

  <!-- Three.js r128 & GSAP 3.12 (Vendored, Zero-Node Dependency) -->
  <script src="{% static 'vendor/three.min.js' %}"></script>
  <script src="{% static 'vendor/gsap.min.js' %}"></script>

  <script>
    // =========================================================================
    // 1. Password Visibility Toggle
    // =========================================================================
    const pwdInput = document.getElementById('passwordInput');
    const confirmPwdInput = document.getElementById('confirmPasswordInput');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('eyeIcon');

    if (toggleBtn && pwdInput) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        if (confirmPwdInput) confirmPwdInput.type = isPassword ? 'text' : 'password';
        eyeIcon.innerHTML = isPassword 
          ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
          : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      });
    }

    // =========================================================================
    // 2. Three.js 3D Dreamy Rose/Sakura Petal Garden Canvas
    // =========================================================================
    (function init3DGarden() {
      const canvas = document.getElementById('gardenCanvas');
      if (!canvas || !window.THREE) return;

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 16);

      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));

      // Lighting
      const ambient = new THREE.AmbientLight(0x28182f, 1.6);
      scene.add(ambient);

      const sunlight = new THREE.DirectionalLight(0xffeedd, 2.0);
      sunlight.position.set(10, 15, 10);
      scene.add(sunlight);

      const pinkLight = new THREE.PointLight(0xf472b6, 2.2, 35);
      pinkLight.position.set(-8, -4, 6);
      scene.add(pinkLight);

      // Create Custom Organic Petal Geometry
      function createPetalGeometry() {
        const shape = new THREE.Shape();
        shape.moveTo(0, 0);
        shape.bezierCurveTo(0.4, 0.3, 0.5, 0.9, 0, 1.4);
        shape.bezierCurveTo(-0.5, 0.9, -0.4, 0.3, 0, 0);
        return new THREE.ShapeGeometry(shape, 12);
      }

      const petalGeo = createPetalGeometry();
      const petalMat = new THREE.MeshStandardMaterial({
        color: 0xff8fa3,
        roughness: 0.35,
        metalness: 0.1,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.88
      });

      const petalGroup = new THREE.Group();
      scene.add(petalGroup);

      const petals = [];
      const petalCount = 50;

      for (let i = 0; i < petalCount; i++) {
        const mesh = new THREE.Mesh(petalGeo, petalMat.clone());
        mesh.material.color.setHSL(0.93 + (Math.random() - 0.5) * 0.05, 0.85, 0.72);
        
        mesh.position.set(
          (Math.random() - 0.5) * 26,
          (Math.random() - 0.5) * 20,
          (Math.random() - 0.5) * 14
        );
        mesh.scale.setScalar(0.4 + Math.random() * 0.5);
        mesh.rotation.set(
          Math.random() * Math.PI,
          Math.random() * Math.PI,
          Math.random() * Math.PI
        );

        mesh.userData = {
          speedY: -(0.015 + Math.random() * 0.025),
          speedX: (Math.random() - 0.5) * 0.012,
          rotSpeedX: (Math.random() - 0.5) * 0.03,
          rotSpeedY: (Math.random() - 0.5) * 0.025,
          rotSpeedZ: (Math.random() - 0.5) * 0.02,
          wobbleOffset: Math.random() * Math.PI * 2
        };

        petalGroup.add(mesh);
        petals.push(mesh);
      }

      // Ambient Starlight Dust
      const dustGeo = new THREE.BufferGeometry();
      const dustCount = 450;
      const dustPos = new Float32Array(dustCount * 3);
      for (let i = 0; i < dustCount * 3; i += 3) {
        dustPos[i] = (Math.random() - 0.5) * 35;
        dustPos[i + 1] = (Math.random() - 0.5) * 25;
        dustPos[i + 2] = (Math.random() - 0.5) * 20;
      }
      dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
      const dustMat = new THREE.PointsMaterial({ color: 0xffd1dc, size: 0.09, transparent: true, opacity: 0.7 });
      const dustPoints = new THREE.Points(dustGeo, dustMat);
      scene.add(dustPoints);

      // Mouse Parallax
      let mouseX = 0, mouseY = 0;
      let targetX = 0, targetY = 0;

      window.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
        mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
      });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
          mouseX = (e.touches[0].clientX / window.innerWidth - 0.5) * 2;
          mouseY = (e.touches[0].clientY / window.innerHeight - 0.5) * 2;
        }
      }, { passive: true });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Render Loop
      let clock = new THREE.Clock();

      function animate() {
        if (prefersReducedMotion) return;

        requestAnimationFrame(animate);
        const elapsedTime = clock.getElapsedTime();

        targetX += (mouseX - targetX) * 0.04;
        targetY += (mouseY - targetY) * 0.04;
        camera.position.x = targetX * 1.4;
        camera.position.y = -targetY * 1.4;
        camera.lookAt(0, 0, 0);

        // Drift Petals
        petals.forEach(p => {
          p.position.y += p.userData.speedY;
          p.position.x += p.userData.speedX + Math.sin(elapsedTime * 1.5 + p.userData.wobbleOffset) * 0.01;
          
          p.rotation.x += p.userData.rotSpeedX;
          p.rotation.y += p.userData.rotSpeedY;
          p.rotation.z += p.userData.rotSpeedZ;

          // Wrap around top if falls off screen
          if (p.position.y < -12) {
            p.position.y = 12;
            p.position.x = (Math.random() - 0.5) * 24;
          }
        });

        dustPoints.rotation.y = elapsedTime * 0.015;

        renderer.render(scene, camera);
      }

      animate();
    })();

    // =========================================================================
    // 3. GSAP Card Entrance & Feedback
    // =========================================================================
    if (window.gsap) {
      gsap.fromTo('#authCard',
        { opacity: 0, scale: 0.9, y: 30, filter: 'blur(14px)' },
        { opacity: 1, scale: 1, y: 0, filter: 'blur(0px)', duration: 1.1, ease: 'power3.out' }
      );

      const errorBanner = document.getElementById('errorBanner');
      if (errorBanner) {
        gsap.fromTo(errorBanner,
          { x: -12 },
          { x: 12, duration: 0.06, repeat: 5, yoyo: true, ease: 'power1.inOut' }
        );
      }

      const form = document.getElementById('registerForm');
      const submitBtn = document.getElementById('submitBtn');
      if (form && submitBtn) {
        form.addEventListener('submit', () => {
          submitBtn.innerHTML = '<span>✦ Creating Account...</span>';
          submitBtn.style.opacity = '0.85';
          submitBtn.style.pointerEvents = 'none';
        });
      }
    }
  </script>
</body>
</html>
