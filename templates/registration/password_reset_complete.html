{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="romantic_aurora">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Password Reset Complete — Celebration Studio</title>
  
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #120918;
      color: #fdf2f8;
      font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .garden-atmosphere {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: 
        radial-gradient(circle at 80% 20%, rgba(244, 114, 182, 0.28) 0%, rgba(244, 114, 182, 0) 50%),
        radial-gradient(circle at 20% 80%, rgba(139, 92, 246, 0.22) 0%, rgba(139, 92, 246, 0) 60%),
        radial-gradient(circle at 50% 50%, rgba(18, 9, 24, 0.3) 0%, rgba(12, 6, 18, 0.82) 80%, #0d0614 100%);
    }

    .auth-stage {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 460px;
      padding: 24px;
      perspective: 1200px;
    }

    .crystal-card {
      position: relative;
      background: radial-gradient(130% 100% at 75% 15%, rgba(255, 255, 255, 0.24) 0%, rgba(255, 220, 240, 0.1) 45%, rgba(24, 12, 34, 0.72) 100%);
      backdrop-filter: blur(28px) saturate(170%);
      -webkit-backdrop-filter: blur(28px) saturate(170%);
      border: 1.5px solid rgba(255, 255, 255, 0.36);
      border-radius: 28px;
      padding: 44px 34px 38px;
      box-shadow: 
        0 24px 60px rgba(0, 0, 0, 0.65),
        0 0 50px rgba(236, 72, 153, 0.22),
        inset 0 1px 2px rgba(255, 255, 255, 0.6);
      overflow: hidden;
      text-align: center;
    }

    .icon-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(52, 211, 153, 0.35) 0%, rgba(16, 185, 129, 0.15) 70%);
      border: 1.5px solid rgba(52, 211, 153, 0.6);
      box-shadow: 0 0 32px rgba(52, 211, 153, 0.4);
      margin-bottom: 20px;
      font-size: 2.2rem;
    }

    .card-badge {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 700;
      background: linear-gradient(90deg, #34d399, #10b981, #6ee7b7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 1.85rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    }

    .card-message {
      font-size: 0.94rem;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .btn-garden-bloom {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 9999px;
      background: linear-gradient(135deg, #10b981 0%, #059669 50%, #047857 100%);
      color: #ffffff;
      font-size: 0.98rem;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.02em;
      box-shadow: 
        0 10px 24px rgba(16, 185, 129, 0.4),
        0 0 20px rgba(52, 211, 153, 0.25);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-garden-bloom:hover {
      transform: translateY(-2px);
      box-shadow: 
        0 14px 32px rgba(16, 185, 129, 0.5),
        0 0 30px rgba(52, 211, 153, 0.35);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="garden-atmosphere"></div>

  <main class="auth-stage">
    <div class="crystal-card">
      
      <div class="icon-badge">✨</div>

      <div>
        <span class="card-badge">✦ SUCCESS ✦</span>
        <h1 class="card-title">Password Reset Complete</h1>
      </div>

      <p class="card-message">
        Your password has been securely updated! You may now sign in to Celebration Studio using your new credentials.
      </p>

      <a href="{% url 'login' %}" class="btn-garden-bloom" id="signInNewBtn">
        <span>Sign In to Creator Studio</span>
        <span style="font-size: 1.15rem;">➔</span>
      </a>

    </div>
  </main>

</body>
</html>
